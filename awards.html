<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>The Dan Awards</title>

  <link
    rel="stylesheet"
    href="awards.css"
  >
</head>


<body>

  <main class="awards-page">

    <a
      class="back-link"
      href="index.html"
    >
      ← back to your care package
    </a>


    <header class="awards-header">

      <p class="eyebrow">
        presenting...
      </p>

      <h1>
        The Dan Awards 🏆
      </h1>

      <p class="subtitle">
        an extremely prestigious ceremony
      </p>

    </header>


    <section class="award-stage">

      <div
        class="award-card"
        id="awardCard"
      >

        <div
          class="award-number"
          id="awardNumber"
        >
          AWARD 1
        </div>


        <div
          class="award-icon"
          id="awardIcon"
        >
          🏆
        </div>


        <h2
          class="award-title"
          id="awardTitle"
        >
        </h2>


        <p
          class="award-text"
          id="awardText"
        >
        </p>


        <div class="recipient">

          AWARDED TO

          <strong>
            DAN
          </strong>

        </div>


        <button
          class="next-award"
          id="nextAward"
          type="button"
        >
          accept award →
        </button>

      </div>

    </section>


    <section
      class="award-ending"
      id="awardEnding"
      aria-hidden="true"
    >

      <div class="ending-card">

        <p>
          ceremony concluded
        </p>

        <h2>
          congratulations, award-winning boyfriend ♡
        </h2>

        <a
          href="index.html"
          class="return-button"
        >
          back to your care package
        </a>

      </div>

    </section>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js">
  </script>

  <script src="awards.js"></script>

</body>

</html>
